# Dependabot mantiene las dependencias directas al día abriendo PRs.
# El workflow ci.yml corre tests+tsc en cada PR y auto-mergea los patch/minor
# que pasen en verde; los major esperan aprobación manual.
# Las vulnerabilidades transitivas (las que arrastran shadcn/convex/vitest)
# Dependabot no las puede PR-ear; esas se cierran con `overrides` en package.json.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Un solo PR agrupado para minor/patch evita el spam de un PR por paquete.
    # Los major van sueltos porque suelen traer breaking changes que revisar.
    groups:
      # Excepción a lo anterior: vitest y @vitest/ui se fijan mutuamente la
      # versión exacta en sus peer deps, así que por separado ninguno de los
      # dos PRs resuelve y `npm ci` muere con ERESOLVE antes de correr nada.
      # Van juntos y en todos los update-types, major incluido. El grupo va
      # el primero porque Dependabot aplica el primero que encaja.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint aún no soporta TS 7: `next build` y `npm run lint`
      # fallan con "typescript-eslint does not support TS 7.0" (vía
      # eslint-config-next). El CI solo corre vitest, así que el PR pasa en
      # verde pese a romper build/lint. Reactivar el major cuando
      # typescript-eslint publique soporte para TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
