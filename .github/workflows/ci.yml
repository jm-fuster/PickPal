name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sin bloque `permissions` a nivel de workflow: lo que se declare aquí lo
# heredan TODOS los jobs, y `test` ejecuta `npm ci`, que corre los scripts de
# instalación de cada dependencia. Darle a ese job permiso de escritura es
# regalarle el token a código de terceros. Cada job pide lo suyo, abajo.

jobs:
  # Red de seguridad: typecheck + tests en cada push y PR.
  test:
    runs-on: ubuntu-latest
    # Solo leer el código. No empuja, no comenta, no mergea.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Sin esto, checkout deja el token en .git/config del runner, donde
          # cualquier script de instalación puede leerlo. Este job no empuja
          # nada, así que no le hace falta.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Lee .nvmrc en vez de fijar la versión aquí: así CI, el entorno local
          # y lo que declara `engines` no pueden desviarse entre sí.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Convex usa su propio tsconfig y `convex deploy` lo typechquea aparte;
      # sin esto, errores solo-de-Convex (p.ej. globals de @types/node) pasan
      # el CI pero rompen el deploy en Vercel.
      - run: npx tsc -p convex/tsconfig.json --noEmit
      - run: npm test

  # Auto-merge SOLO para PRs de Dependabot de tipo patch/minor.
  # `needs: test` garantiza que esto solo corre si los tests pasaron en verde:
  # ahí está el gate. Los major se quedan esperando aprobación manual.
  dependabot-automerge:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    # Los únicos permisos de escritura del workflow, y solo en el job que los
    # necesita para mergear.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Leer metadatos de Dependabot
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Mergear si es patch o minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
